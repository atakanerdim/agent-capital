<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff — Crestpoint Analytics</title>
<meta name="description" content="Eleven colleagues. None of them people.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Crestpoint Analytics">
<meta property="og:title" content="Staff — Crestpoint Analytics">
<meta property="og:description" content="Eleven colleagues. None of them people.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#123B2E">
<meta property="og:image" content="https://atakanerdim.github.io/agent-capital/assets/og-crestpoint.png">
<link rel="canonical" href="https://atakanerdim.github.io/agent-capital/staff.html">
<link rel="icon" href="assets/crestpoint-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--cyanotype:#1B3B6F;--prussian:#0F2547;--plotter:#F4F7FB;--highlight:#FFD23F;--pencil:#FF6B5B;--pencil-text:#FF8A7D;--pencil-paper:#D23F2F;--pencil-ink:#B3261E;--whiteprint:#F2F4F7;--ghost:rgba(244,247,251,.5);--rule:rgba(244,247,251,.2);--rule3:rgba(244,247,251,.3);--rule7:rgba(244,247,251,.7);--muted:rgba(244,247,251,.74);--grid-minor:rgba(244,247,251,.04);--grid-major:rgba(244,247,251,.08);--ease-plot:cubic-bezier(.65,0,.35,1);--ease-settle:cubic-bezier(.2,.8,.2,1);--ease-stamp:cubic-bezier(.3,1.6,.5,1);--ease-out:cubic-bezier(.4,0,.2,1);--sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;--doc:'Newsreader',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html{background:#1B3B6F}
body{margin:0;background:#1B3B6F;color:#F4F7FB;font-family:var(--sans);font-size:17px;line-height:26px;font-stretch:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:#F4F7FB;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--highlight);outline-offset:3px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:620;font-stretch:112%;letter-spacing:-.015em}
ul,ol{margin:0;padding:0;list-style:none}
dl,dd{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(1280px,100% - 10vw);margin-inline:auto}
.site{position:relative;min-height:100%;overflow-x:clip}
.skip-link{position:absolute;left:5vw;top:-60px;z-index:50;background:var(--highlight);color:var(--prussian);padding:10px 16px;border-radius:3px;text-decoration:none;font-weight:600}
.skip-link:focus{top:12px}

/* header and the desk's rail */
.hdr{position:sticky;top:0;z-index:30;border-bottom:.75px solid var(--rule);background:var(--cyanotype);transition:background-color .2s var(--ease-out)}
.hdr.is-scrolled{background:var(--prussian)}
.hdr-in{display:flex;align-items:center;gap:32px;min-height:64px}
.mark{font-weight:650;font-stretch:118%;font-size:19px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:26px}
.nav a{text-decoration:none;white-space:nowrap;padding-block:6px;background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .2s var(--ease-out)}
.nav a:hover{background-size:100% 1px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--highlight);box-shadow:0 0 0 3px rgba(255,210,63,.18)}
.live-date{font-size:13.6px;font-stretch:85%;color:var(--muted)}
.top-rail{position:sticky;top:var(--hh,65px);z-index:29;background:var(--prussian);border-bottom:.75px solid var(--rule7)}
.top-rail p{display:flex;align-items:flex-start;gap:12px;padding:8px 0 9px;font-size:17px;line-height:24px}
.top-rail svg{flex:none;margin-top:5px}

/* shared */
.btn{position:relative;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border:1.5px solid var(--plotter);border-radius:3px;color:var(--plotter);background:transparent;text-decoration:none;font-family:var(--sans);font-size:17px;font-weight:540;font-stretch:104%;cursor:pointer;transition:transform .12s var(--ease-out)}
.btn::after{content:'';position:absolute;left:22px;right:22px;bottom:7px;height:7px;border-left:1px solid currentColor;border-right:1px solid currentColor;background:linear-gradient(currentColor,currentColor) 0 50%/100% 1px no-repeat;opacity:0;transform:scaleX(.6);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
.btn:hover::after{opacity:.9;transform:none}
.btn:hover{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--highlight);border-color:var(--highlight);color:var(--prussian)}
.btns{display:flex;flex-wrap:wrap;gap:16px}
.rail{display:flex;align-items:flex-start;gap:12px;padding:11px 16px 12px;background:var(--prussian);border:.75px solid var(--rule7);font-size:17px;line-height:24px;color:var(--plotter)}
.rail svg{flex:none;margin-top:3px}
.rails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}
.asof{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 3px;border:.75px solid var(--rule7);font-size:13.6px;line-height:20px;font-stretch:85%;color:var(--plotter);white-space:nowrap}
.sec{position:relative;padding-block:120px;border-top:.75px solid var(--rule)}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.h2{font-size:clamp(33.2px,3.7vw,51.9px);line-height:1.04}
.lede{font-size:21.25px;line-height:32px;max-width:40em}
.body{max-width:38em;color:var(--plotter)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pt{display:block;border-radius:50%;box-shadow:0 0 0 1.5px var(--plotter);background:var(--prussian)}
.stamp{display:inline-flex;align-items:center;padding:4px 10px 5px;border:2px solid currentColor;border-radius:4px;font-size:14px;line-height:1;font-weight:700;font-stretch:112%;transform:rotate(-6deg);filter:url(#worn);white-space:nowrap}
.stamp-ok{color:var(--plotter)}
.stamp-red{color:var(--pencil)}
.quote{font-family:var(--doc);font-style:italic}

/* title block */
.tb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75px;background:var(--rule7);border:1.5px solid var(--rule7)}
.tb>div{background:var(--prussian);padding:8px 12px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tb-l{font-size:13px;line-height:16px;font-stretch:85%;color:var(--muted)}
.tb-v{font-size:17px;line-height:22px;font-stretch:112%;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-appr{flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px}
.tb-appr>span{display:flex;flex-direction:column;gap:3px}
.typed>span{display:inline-block}
.tb .c2{grid-column:span 2}.tb .c3{grid-column:span 3}.tb .c4{grid-column:span 4}.tb .c5{grid-column:span 5}

/* hero: the trading floor */
.hero{padding-top:20px;padding-bottom:96px}
.plan-frame{position:relative;border:1.5px solid var(--rule7);padding:8px}
.plan-frame::before{content:'';position:absolute;inset:8px;border:.75px solid var(--rule3);pointer-events:none}
.plan-scroll{position:relative;overflow-x:auto;scrollbar-width:none}
.plan-scroll::-webkit-scrollbar{display:none}
.plan-grid{position:relative;background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:64px 64px,64px 64px,8px 8px,8px 8px;background-position:-1px -1px}
.plan{display:block;width:100%;height:auto;max-height:max(280px,calc(100vh - 480px))}
.plan .desk .dk,.plan .desk .ch{stroke-dasharray:1}
.tb-hero{position:absolute;right:calc(8px + 1.9%);bottom:calc(8px + 2.3%);width:44.4%;grid-template-columns:repeat(12,minmax(0,1fr))}
.tb-hero>div{padding:4px 9px 6px;gap:1px}
.tb-hero .tb-l{font-size:12px;line-height:14px}
.tb-hero .tb-v{font-size:15px;line-height:19px}
.tb-hero .stamp{font-size:11.5px;padding:3px 7px 4px}
.plan .w{fill:none;stroke:var(--plotter);stroke-width:1.75;stroke-linejoin:miter}
.plan .wi{fill:none;stroke:var(--plotter);stroke-width:1;opacity:.7}
.plan .ptn{fill:none;stroke:var(--plotter);stroke-width:1.25;opacity:.85}
.plan .dr{fill:none;stroke:var(--plotter);stroke-width:1;opacity:.6}
.plan .post{fill:var(--plotter)}
.plan .lbl{fill:var(--muted);font-family:var(--sans);font-size:14px;font-stretch:90%}
.plan .lbl-s{font-size:12px}
.plan .dk{fill:none;stroke:var(--plotter);stroke-width:1.25}
.plan .ch{fill:none;stroke:var(--plotter);stroke-width:1;opacity:.6}
.plan .lit{fill:var(--highlight);stroke:none}
.plan .ini{fill:var(--plotter);font-family:var(--sans);font-size:12px;font-weight:600;font-stretch:90%;text-anchor:middle}
.plan .ini-d{fill:var(--prussian)}
.plan .gdesk{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:6 5}
.plan .cab{fill:url(#hatch);stroke:var(--plotter);stroke-width:1}
.plan .gbook{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:6 5}
.plan .bk{fill:var(--muted);font-family:var(--sans);font-size:9.5px;font-weight:600;font-stretch:85%;text-anchor:middle}
.plan .rwall{fill:url(#hatch);stroke:var(--plotter);stroke-width:1.25}
.plan .mk{fill:var(--highlight);opacity:0}
.plan .rx{fill:none;stroke:var(--pencil);stroke-width:2.2;stroke-linecap:round}
.plan .pen{fill:var(--plotter);opacity:0}
.plan .sw-off{fill:none;stroke:var(--plotter);stroke-width:1.25}
.snap{position:absolute;top:0;width:1px;height:1px;scroll-snap-align:start}
.snap-b{right:0;scroll-snap-align:end}
.h1{font-size:clamp(44px,min(6.3vw,10.6vh),88px);line-height:.98;font-weight:620;font-stretch:112%;letter-spacing:-.02em;margin-top:32px}
.h1 .ln{display:block;white-space:nowrap}
.hero-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:28px;margin-top:32px;align-items:end}
.hero-copy{grid-column:1 / span 7}
.hero-act{grid-column:9 / span 4;justify-content:flex-end}

/* next door */
.live-cta{margin-top:64px;padding-top:32px;border-top:.75px solid var(--rule)}
.door-grid{display:flex;flex-direction:column;gap:28px}
.door-col{display:flex;flex-direction:column;gap:16px}
.door{display:grid!important;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:40px;align-items:center}
.door-txt{display:flex;flex-direction:column;gap:14px}
.chest{position:relative;padding-top:24px}
.door{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px 22px 26px;background:var(--cyanotype);border:1.5px solid var(--rule7);text-decoration:none;color:var(--plotter);transition:transform .4s var(--ease-settle)}
.door::before{content:'';position:absolute;inset:6px;border:.75px solid var(--rule3);pointer-events:none}
.door:hover,.door:focus-visible{transform:translateY(-24px);text-decoration:none}
.drawer{height:30px;margin-top:-1px;border:1.5px solid var(--rule7);background:var(--prussian);display:flex;align-items:center;justify-content:center}
.drawer span{width:72px;height:6px;border:1px solid var(--rule7);border-radius:3px}
.door-art{display:block;width:100%;height:auto;aspect-ratio:400 / 220}
.door-art path,.door-art rect,.door-art circle{fill:none;stroke:var(--plotter);stroke-width:1.25;opacity:.42;transition:opacity .3s var(--ease-out)}
.door:hover .door-art path,.door:hover .door-art rect,.door:hover .door-art circle,.door:focus-visible .door-art path,.door:focus-visible .door-art rect,.door:focus-visible .door-art circle{opacity:1;stroke-dasharray:1;animation:plot 900ms var(--ease-plot) backwards}
.door-name{font-size:26.6px;line-height:32px;font-weight:620;font-stretch:112%}
.door-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.door-fig{font-size:21.25px;font-weight:600;font-stretch:104%}
.door-ghost{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.door .btn{align-self:flex-start;margin-top:6px}

/* footer */
.foot{border-top:1.5px solid var(--rule7);background:var(--prussian);padding-block:48px 56px}
.foot-in{display:flex;flex-direction:column;gap:24px}
.foot .tb{grid-template-columns:1fr 1.05fr .8fr 1fr 1.35fr 1.75fr 1.05fr}
.foot .tb>div{background:#0B1D3A}
.foot .stamp{font-size:11.5px;padding:3px 7px 4px}
.foot-text{max-width:52em;color:var(--plotter)}
.foot-links{display:flex;flex-wrap:wrap;gap:12px 28px}

/* motion */
@keyframes plot{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sweep{from{font-stretch:62%;opacity:0}12%{opacity:1}to{font-stretch:112%;opacity:1}}
@keyframes pen{0%{offset-distance:0%;opacity:1}98%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes travel{0%{offset-distance:0%;opacity:0}6%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes bounce{0%{offset-distance:0%;opacity:0}6%{opacity:1}64%{offset-distance:100%}74%{offset-distance:93%}84%{offset-distance:98%}92%{offset-distance:96%;opacity:1}100%{offset-distance:96%;opacity:0}}
@keyframes stamp{0%{opacity:0;transform:scale(1.4) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes xmark{0%{opacity:0;transform:scale(1.6)}100%{opacity:1;transform:none}}
@keyframes slide{0%{transform:translateX(var(--from,0px))}62%{transform:translateX(calc(100cqw - var(--wallR) - var(--wallW) - var(--cardW) + 6px))}78%{transform:translateX(calc(100cqw - var(--wallR) - var(--wallW) - var(--cardW) - 14px))}100%{transform:translateX(calc(100cqw - var(--wallR) - var(--wallW) - var(--cardW) - 4px))}}
.plan .plot{stroke-dasharray:1}
.plan .rxg{transform-box:fill-box;transform-origin:center}
.m-anim .hero.go .plan-grid{animation:fadein .2s linear backwards}
.m-anim .hero.go .plan .plot{animation:plot var(--d,800ms) var(--ease-plot) var(--dl,0ms) backwards}
.m-anim .hero.go .plan .pen{animation:pen var(--d,800ms) var(--ease-plot) var(--dl,0ms) backwards}
.m-anim .hero.go .plan .fade{animation:fadein .35s var(--ease-out) var(--dl,0ms) backwards}
.m-anim .hero.go .plan .desk .dk,.m-anim .hero.go .plan .desk .ch{animation:plot .28s var(--ease-plot) calc(1200ms + var(--k) * 80ms) backwards}
.m-anim .hero.go .plan .desk .ini{animation:fadein .2s linear calc(1300ms + var(--k) * 80ms) backwards}
.m-anim .hero.go .plan .desk .lit,.m-anim .hero.go .plan .desk .ini-d{animation:fadein .3s var(--ease-settle) calc(2000ms + var(--j) * 66ms) backwards}
.m-anim .hero.go .plan .mk{animation:travel 2.2s var(--ease-plot) var(--dl) backwards}
.m-anim .hero.go .plan .mk-b{animation:bounce 2.2s var(--ease-plot) var(--dl) backwards}
.m-anim .hero.go .plan .rxg{animation:xmark .18s var(--ease-stamp) 4.25s backwards}
.m-anim .hero.go .plan .cab,.m-anim .hero.go .plan .rwall{animation:plot var(--d,800ms) var(--ease-plot) var(--dl,0ms) backwards,fadein .3s linear var(--dl,0ms) backwards}
.m-anim .hero.go .h1 .ln{animation:sweep .6s var(--ease-settle) 2.6s backwards}
.m-anim .hero.go .h1 .ln2{animation-delay:2.72s}
.m-anim .hero.go .h1 .ln3{animation-delay:2.84s}
.m-anim .hero.go .hero-copy,.m-anim .hero.go .hero-act{animation:fadein .5s var(--ease-out) 3.05s backwards}
.m-anim .hero.go .tb-hero{animation:fadein .3s linear 2.9s backwards}
.m-anim .hero.go .tb .tb-v{animation:fadein .25s linear calc(3000ms + var(--f) * 70ms) backwards}
.m-anim .hero.go .tb .typed>span{animation:fadein .01s linear calc(3420ms + var(--i) * 45ms) backwards}
.m-anim .hero.go .tb .stamp{animation:stamp .18s var(--ease-stamp) 3.72s backwards}
.m-anim .hero.is-skipped *{animation:none!important}
.m-anim .refusal:not(.go) .ocard{transform:translateX(var(--from,0px));opacity:0}
.m-anim .refusal:not(.go) .ocard .stamp{opacity:0}
.m-anim .refusal.go .ocard{animation:slide 1.05s var(--ease-settle) .15s backwards}
.m-anim .refusal.go .ocard .stamp{animation:stamp .18s var(--ease-stamp) 1.12s backwards}
.m-anim .rewrite:not(.go) .rw-strike,.m-anim .rewrite:not(.go) .rw-cloud,.m-anim .rewrite:not(.go) .rw-tri{opacity:0}
.m-anim .rewrite.go .rw-strike path{stroke-dasharray:1;animation:plot .5s var(--ease-plot) var(--dl,300ms) backwards}
.m-anim .rewrite.go .rw-cloud path{stroke-dasharray:1;animation:plot .9s var(--ease-plot) 1.2s backwards}
.m-anim .rewrite.go .rw-tri{animation:stamp .2s var(--ease-stamp) 2.15s backwards}
.m-still *,.m-still *::before,.m-still *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


.st-hero{padding:72px 0 64px}
.st-hero .h1{margin-top:0;max-width:13em}
.st-hero .lede{margin-top:28px;max-width:38em}
.st-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.st-people{grid-column:1 / span 8;min-width:0}
.room{margin:44px 0 16px;font-size:21.25px;line-height:28px;font-weight:620;font-stretch:108%;display:flex;align-items:baseline;gap:12px}
.room small{font-size:14px;font-weight:400;font-stretch:100%;color:var(--muted)}
.st-people .room:first-of-type{margin-top:28px}
.folks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px}
.who{position:relative;display:flex;align-items:center;gap:20px;width:100%;padding:6px 8px 6px 2px;border:0;background:transparent;color:var(--plotter);font:inherit;text-align:left;cursor:pointer;border-radius:2px}
.det{position:relative;flex:none;width:88px;height:88px;display:flex;align-items:center;justify-content:center}
.det img{position:relative;width:66px;height:66px;border-radius:50%}
.det svg{position:absolute;inset:0;width:88px;height:88px;overflow:visible}
.det .ring{fill:none;stroke:var(--plotter);stroke-width:1.25;opacity:.3;transition:opacity .2s var(--ease-out)}
.det .lead{fill:none;stroke:var(--plotter);stroke-width:1;opacity:0}
.who:hover .ring,.who:focus-visible .ring,.who.is-sel .ring{opacity:1;stroke-dasharray:1;animation:plot .55s var(--ease-plot) backwards}
.who:hover .lead,.who:focus-visible .lead,.who.is-sel .lead{opacity:1;stroke-dasharray:1;animation:plot .25s var(--ease-plot) .45s backwards}
.who.is-sel .ring{stroke:var(--highlight);stroke-width:2}
.plate{display:flex;flex-direction:column;gap:1px;min-width:0}
.plate b{font-weight:620;font-size:16px;line-height:21px}
.plate>span{font-size:13.6px;line-height:18px;color:var(--muted)}
.plate .dy{color:var(--plotter)}
.who.is-sel .plate b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--highlight)}
.gcard{display:flex;align-items:center;gap:20px;padding:6px 8px 6px 2px}
.gcard svg{flex:none;width:88px;height:88px;overflow:visible}
.gcard .gs{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:6 5}
.gcard:hover .gs{animation:march .9s linear 1}
@keyframes march{to{stroke-dashoffset:-22}}
.gcard .plate>span{color:var(--plotter)}
.one{grid-column:9 / span 4;position:sticky;top:calc(var(--hh,65px) + 72px);padding:22px 22px 24px;border:1.5px solid var(--plotter);background:var(--prussian);display:flex;flex-direction:column;gap:16px;margin-top:28px}
.one-top{display:flex;gap:16px;align-items:center}
.one-top img{width:84px;height:84px;border-radius:50%;flex:none}
.one-n{font-size:23px;line-height:28px;font-weight:620;font-stretch:108%}
.one-r{font-size:14px;line-height:20px;color:var(--muted)}
.one .bio{font-size:15.5px;line-height:23px}
.one dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px 16px;border-top:.75px solid var(--rule);padding-top:14px}
.one dt{font-size:13.6px;line-height:24px;color:var(--muted)}
.one dd{font-size:16px;line-height:24px;min-width:0;overflow-wrap:anywhere}
.one .when{display:block;margin-top:4px;font-size:13.6px;line-height:18px;color:var(--muted)}
.one .quote{display:block}
.m-anim .one.is-swap{animation:fadein .35s var(--ease-out)}
.s3-line{margin:18px 0 36px;max-width:44em}
.roster{width:100%;border-collapse:collapse;font-size:15px;line-height:20px}
.roster th{font-weight:600;text-align:center;padding:8px 4px;border-bottom:1.5px solid var(--rule7)}
.roster th:first-child{text-align:left}
.roster td{padding:6px 4px;border-bottom:.75px solid var(--rule)}
.roster td.nm{white-space:nowrap}
.roster td.nm img{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:10px}
.roster td.c{text-align:center;width:9%}
.roster td.c span{display:block;height:14px;margin:0 6px;border:1px solid var(--rule3)}
.roster td.on span{background:var(--plotter);border-color:var(--plotter)}
.roster .today{background:rgba(90,61,156,.08)}
.roster th.today{color:var(--highlight)}
.roster tr.lit td.nm{font-weight:600}
.m-anim .roster td.today.on span{background:var(--plotter)}
.roster.go td.today.on span,.m-still .roster td.today.on span{background:var(--highlight);border-color:var(--highlight)}
.m-anim .roster.go td.today.on span{transition:background-color .3s var(--ease-out) calc(var(--i) * 90ms),border-color .3s var(--ease-out) calc(var(--i) * 90ms)}
@media (max-width:1100px){.folks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){.st-people,.one{grid-column:1 / -1}.one{position:static;margin-top:40px}.hdr-in{flex-wrap:wrap;row-gap:0;column-gap:16px;padding-top:10px}.hdr nav{order:3;width:100%}.nav{padding-bottom:8px;flex-wrap:wrap;column-gap:18px;row-gap:2px}.rails{grid-template-columns:minmax(0,1fr);gap:12px}.foot .tb{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense}.foot .tb .tb-appr{grid-column:span 2}}
@media (max-width:720px){.hdr{position:relative}.top-rail{top:0}.sec{padding-block:80px}.st-hero{padding:48px 0 40px}.h1{font-size:clamp(38px,10.4vw,60px)}.folks{grid-template-columns:minmax(0,1fr)}.roster{font-size:13px}.roster td.nm img{display:none}.roster td.c span{margin:0 2px}.tb,.foot .tb{grid-template-columns:repeat(2,minmax(0,1fr))}.tb .tb-appr,.foot .tb .tb-appr{grid-column:1 / -1}.live{font-size:15px}.live-date{display:none}}

.det .gr{fill:none;stroke:var(--tint);stroke-width:.7;opacity:.85;transform-origin:44px 44px;transition:opacity .2s}
.det .gr2{stroke:var(--highlight);opacity:.5}
.det .gr-o,.det .gr-i{fill:none;stroke:var(--plotter);stroke-width:.9}
.who:hover .gr,.who:focus-visible .gr,.who.is-sel .gr{stroke-dasharray:1;animation:plot .7s var(--ease-plot) backwards,turn 1.4s var(--ease-settle) backwards}
.who.is-sel .gr{stroke:var(--highlight);opacity:.9}
.who.is-sel .gr-o{stroke:var(--highlight);stroke-width:1.6}
@keyframes turn{from{transform:rotate(-24deg)}to{transform:none}}
.roster .today{background:rgba(90,61,156,.07)}
.room{font-family:var(--display);font-weight:560;letter-spacing:-.01em}
.one-n{font-family:var(--display)}
.one{box-shadow:inset 0 0 0 4px var(--prussian),inset 0 0 0 4.75px var(--rule3)}

html,body{background:var(--cyanotype)}
body{color:var(--plotter);font-family:var(--sans);font-size:16.5px;line-height:26px}
a{color:inherit;text-decoration-color:rgba(15,51,40,.45)}
a:hover{text-decoration-color:currentColor}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--highlight);outline-offset:3px}
::selection{background:rgba(90,61,156,.22)}
h1,h2,h3{font-family:var(--display);font-weight:540;font-stretch:100%;letter-spacing:-.012em}
.h1{font-family:var(--display);font-weight:520;font-stretch:100%;letter-spacing:-.024em;line-height:1.02}
.h2{font-family:var(--display);font-weight:520;letter-spacing:-.018em;line-height:1.06}
.lede{font-size:20px;line-height:31px}
.quote{font-family:var(--doc);font-style:italic;font-weight:400}
.person .md{font-family:var(--display);font-weight:450}
.tb-appr .tb-l{white-space:nowrap}
.door-name .logo{display:inline-block;vertical-align:-5px;margin-right:10px}
.skip-link{background:var(--intaglio);color:var(--note)}

/* header: the dark border of a note */
.hdr{background:var(--intaglio);color:var(--note);border-bottom:0}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--band) repeat-x 0 0/auto 8px;pointer-events:none;opacity:.9}
.hdr.is-scrolled{background:var(--intaglio-2)}
.hdr-in{min-height:68px;padding-bottom:4px}
.hdr a{color:var(--note);text-decoration-color:rgba(238,243,234,.5)}
.hdr a:focus-visible{outline-color:var(--note)}
.mark{display:inline-flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.005em;font-stretch:100%}
.mark .logo{flex:none;display:block}
.mark .wm-sub{font-family:var(--sans);font-weight:440;font-size:15px;letter-spacing:.01em;opacity:.8;margin-left:-4px}
.nav a{font-size:16px}
.live{color:var(--note)}
.live-dot{background:#A8DDBC;box-shadow:0 0 0 3px rgba(168,221,188,.2)}
.live-date{color:rgba(238,243,234,.72);font-stretch:100%;font-size:13.5px}
.top-rail{background:var(--prussian);border-bottom:0;box-shadow:0 1px 0 var(--rule7),0 3px 0 var(--prussian),0 4px 0 var(--rule3)}
.top-rail p{font-size:16px;line-height:24px;padding:8px 0 9px}
.top-rail svg,.rail svg{color:var(--seal)}

/* shared */
.btn{border:1.5px solid var(--plotter);border-radius:1px;color:var(--plotter);font-family:var(--sans);font-weight:560;font-size:16.5px;font-stretch:100%;letter-spacing:.005em;box-shadow:inset 0 0 0 3px var(--cyanotype),inset 0 0 0 3.75px var(--rule7);transition:background-color .2s var(--ease-out),transform .12s var(--ease-out)}
.btn::after{display:none}
.btn:hover{background:rgba(15,51,40,.06)}
.btn-primary{background:var(--intaglio);border-color:var(--intaglio);color:var(--note);box-shadow:inset 0 0 0 3px var(--intaglio),inset 0 0 0 3.75px rgba(238,243,234,.55)}
.btn-primary:hover{background:var(--intaglio-2)}
.rail{background:var(--prussian);border:1px solid var(--rule7);box-shadow:inset 0 0 0 3px var(--prussian),inset 0 0 0 3.75px var(--rule3);font-size:16px;color:var(--plotter)}
.asof{border:1px solid var(--rule7);background:var(--prussian);font-stretch:100%;font-size:13px;letter-spacing:.01em}
.sec{border-top:0;background:var(--wave) repeat-x 50% 0/auto 14px}
.stamp{font-family:var(--sans);font-stretch:100%;letter-spacing:.01em;border-radius:3px}
.stamp-ok{color:var(--plotter)}
.pt{box-shadow:0 0 0 1.5px var(--plotter);background:var(--prussian)}
.tb{background:var(--rule7);border:1.5px solid var(--plotter);gap:1px;box-shadow:0 0 0 3px var(--prussian),0 0 0 3.75px var(--rule7)}
.tb>div{background:var(--prussian)}
.tb-l{font-stretch:100%;font-size:12.5px;letter-spacing:.01em}
.tb-v{font-family:var(--display);font-weight:600;font-stretch:100%;letter-spacing:-.005em}
.wm-cp{font-family:var(--display)}

.plan-frame::before{inset:5px;border:.75px solid var(--rule3)}
.plan-grid{background:none}
.plan .lbl{font-family:var(--sans);font-stretch:100%;font-size:13.5px}
.plan .lbl-s{font-size:11.5px}
.plan .ini,.plan .bk{font-family:var(--sans);font-stretch:100%}
.plan .bk{font-size:9px}
.plan .ini{font-size:11px}
.serial{position:absolute;right:46px;top:3px;z-index:2;display:flex;align-items:baseline;gap:10px;padding:0 10px;background:var(--whiteprint);color:var(--seal);font-family:var(--display);font-weight:600;font-size:17px;line-height:22px;letter-spacing:.02em;font-variant-numeric:lining-nums}
.serial small{font-family:var(--sans);font-weight:500;font-size:12.5px;letter-spacing:.01em}
.specimen{position:absolute;z-index:2;pointer-events:none;color:var(--seal);font-family:var(--display);font-style:italic;font-weight:600;letter-spacing:.04em;line-height:1;transform:rotate(-9deg);opacity:.86;mix-blend-mode:multiply}
.hero .specimen{left:5.6%;top:61%;font-size:clamp(28px,3.3vw,46px)}
.specimen::before,.specimen::after{content:'';display:block;height:1.5px;margin:6px 0;background:currentColor;opacity:.75}
.tb-hero{box-shadow:0 0 0 3px var(--whiteprint),0 0 0 3.75px var(--rule7)}

/* engraved h1: printed by a roller, line by line */
@keyframes roller{from{clip-path:inset(-25% 100% -25% 0)}to{clip-path:inset(-25% 0 -25% 0)}}
@keyframes inkpass{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes numbering{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes overprint{0%{opacity:0;transform:rotate(-9deg) scale(1.25)}100%{opacity:.86;transform:rotate(-9deg) scale(1)}}
.m-anim .hero.go .h1 .ln{animation:roller .75s var(--ease-settle) 2.6s backwards}
.m-anim .hero.go .h1 .ln2{animation-delay:2.74s}
.m-anim .hero.go .h1 .ln3{animation-delay:2.88s}
.m-anim .hero.go .plan-frame{animation:inkpass .9s var(--ease-plot) 0s backwards}
.m-anim .hero.go .serial{animation:numbering .3s var(--ease-settle) 2.2s backwards}
.m-anim .hero.go .specimen{animation:overprint .22s var(--ease-stamp) 4.6s backwards}

/* charts and cards */
.chart-box{background:var(--prussian);border:1.5px solid var(--plotter)}
.chart-box::before{inset:5px;border-color:var(--rule3)}
.card{background:var(--prussian);border:1.5px solid var(--plotter);box-shadow:inset 0 0 0 4px var(--prussian),inset 0 0 0 4.75px var(--rule3)}
.card.is-ghost{background:var(--cyanotype);box-shadow:none}
.card-n,.state-top,.c1-q,.proof b,.callout h3,.slip-h,.rw-title,.doc h3{font-family:var(--display);font-stretch:100%;letter-spacing:-.01em}
.card-n{font-weight:620}
.counter .n,.op-n b{font-family:var(--display);font-weight:600;font-stretch:100%;letter-spacing:-.01em}
.card-ret{font-weight:640;font-stretch:100%}
.c1-q{font-weight:520}
.state-top{font-weight:560}
.clab{font-stretch:100%;font-size:13.5px}
.clab.is-sel{background:var(--highlight);color:var(--note)}
.legend,.yt,.xt,.flat-note,.scrub-v,.card-r,.card dt,.card .when,.wall-l,.ledger-l,.sheets-key,.sh-n>span{font-stretch:100%}
.yt,.xt{font-size:13px}
.dot.hd-gh{background:var(--prussian)}
.ocard{background:var(--prussian);box-shadow:inset 0 0 0 4px var(--prussian),inset 0 0 0 4.75px var(--rule3)}
.ocard .stamp{background:var(--prussian)}
.rw-sheet,.doc,.slip{box-shadow:0 1px 0 rgba(15,51,40,.12),0 14px 30px -18px rgba(15,51,40,.35)}
.sh-svg .o{fill:var(--whiteprint)}

/* doors: each firm keeps its own look, even next door */
.qp-look{--cyanotype:#1B3B6F;--prussian:#0F2547;--plotter:#F4F7FB;--highlight:#FFD23F;--ghost:rgba(244,247,251,.5);--rule:rgba(244,247,251,.2);--rule3:rgba(244,247,251,.3);--rule7:rgba(244,247,251,.7);--muted:rgba(244,247,251,.74);--sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;font-family:var(--sans);color:var(--plotter)}
.qp-look .door{box-shadow:none}
.qp-look .door-name{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:620;font-stretch:112%}
.qp-look .btn{border-radius:3px;box-shadow:none;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-stretch:104%;border-color:var(--plotter);color:var(--plotter)}
.qp-look .asof{background:transparent;font-stretch:85%}
.qp-look .door-art .logo-q{opacity:1}
